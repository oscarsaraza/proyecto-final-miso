services:
  postgres:
    image: postgres:16-alpine
    container_name: solventa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: solventa
      POSTGRES_USER: solventa_user
      POSTGRES_PASSWORD: solventa_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solventa_user -d solventa"]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:3.8
    container_name: solventa-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,sqs
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - localstack_data:/var/lib/localstack

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: solventa-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - PORT=8000
      - DATABASE_URL=postgresql+asyncpg://solventa_user:solventa_password@postgres:5432/solventa
      - AWS_REGION=us-east-1
      - AWS_ENDPOINT_URL=http://localstack:4566
      - S3_BUCKET_POLICIES=solventa-policies-dev
      - SQS_QUEUE_EVENTS=solventa-outbox-events-dev
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_started

volumes:
  pgdata:
  localstack_data:
