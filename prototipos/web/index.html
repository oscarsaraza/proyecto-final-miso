<!doctype html>
<html lang="es" data-tema="claro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solventa · Portal Asesor y Gestión Comercial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Cabecera Principal -->
  <header class="cabecera-web">
    <div class="marca-web">
      <span class="simbolo-marca">
        <svg class="icono" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.2-2.9 7.8-7 9-4.1-1.2-7-4.8-7-9V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>
      </span>
      <div>
        <h1>Solventa</h1>
        <p>Aseguradora digital · Open Finance</p>
      </div>
    </div>

    <!-- Pestañas de Navegación -->
    <nav class="nav-tabs" aria-label="Navegación principal">
      <button type="button" class="tab-btn activo" data-pestana="cotizador">
        <svg class="icono" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8l-5-5z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>
        <span>Cotizador y Emisión</span>
      </button>
      <button type="button" class="tab-btn" data-pestana="gestion">
        <svg class="icono" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
        <span>Gestión de Pólizas</span>
      </button>
      <button type="button" class="tab-btn" data-pestana="socios">
        <svg class="icono" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
        <span>Consola Banco Aliado</span>
      </button>
    </nav>

    <!-- Controles de Configuración y Perfil -->
    <div class="controles-web">
      <div class="selector-control">
        <label for="selIdioma">Idioma</label>
        <select id="selIdioma" aria-label="Selector de idioma">
          <option value="es">Español</option>
          <option value="en">English</option>
        </select>
      </div>

      <div class="selector-control">
        <label for="selRegion">Región</label>
        <select id="selRegion" aria-label="Selector de región"></select>
      </div>

      <button type="button" class="btn-icono" id="btnTema" aria-label="Cambiar tema claro u oscuro"></button>

      <div class="perfil-usuario" id="perfilUsuario">
        <div>
          <strong style="display:block;">María F. Ruiz</strong>
          <span style="color:var(--texto-sec);">Asesora comercial</span>
        </div>
        <div class="avatar">MR</div>
        <button type="button" class="btn-logout" id="btnCerrarSesionWeb" title="Cerrar sesión">Salir</button>
      </div>
    </div>
  </header>

  <!-- Área de Contenido Principal -->
  <main class="contenedor-principal" id="mainContenido">
    <!-- Stepper del Cotizador (Visible solo en la pestaña cotizador) -->
    <div id="stepperWrapper">
      <div class="pasos-wizard" id="stepperContainer"></div>
    </div>

    <!-- Contenido Dinámico de la Vista -->
    <div id="contenidoVista"></div>
  </main>

  <!-- Scripts de la Aplicación -->
  <script src="db.js"></script>
  <script src="iconos.js"></script>
  <script src="i18n.js"></script>
  <script src="demo-control.js"></script>
  <script src="app.js"></script>
</body>
</html>
