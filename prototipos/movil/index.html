<!doctype html>
<html lang="es" data-tema="claro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Solventa · Billetera Digital Móvil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Viewport de la Aplicación Móvil (100% responsivo nativo) -->
  <div class="app-movil-viewport">
    
    <!-- Barra de Estado Simulada (Top) -->
    <div class="barra-estado-movil">
      <span>9:41</span>
      <div class="barra-estado-iconos">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.55a11 11 0 0114.08 0M1.42 9a16 16 0 0121.16 0M8.53 16.11a6 6 0 016.95 0M12 20h.01"/></svg>
        <span>82%</span>
      </div>
    </div>

    <!-- Barra Superior de la Aplicación -->
    <header class="app-barra-movil">
      <div class="marca-movil-mini">
        <span class="simbolo-mini">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 3l7 3v6c0 4.2-2.9 7.8-7 9-4.1-1.2-7-4.8-7-9V6l7-3z"/></svg>
        </span>
        <span>Solventa</span>
      </div>

      <div class="controles-movil-top">
        <select id="selIdiomaMovil" style="height:32px;font-size:11px;padding:0 6px;border:1px solid var(--borde);border-radius:6px;background:var(--superficie);color:var(--texto);">
          <option value="es">ES</option>
          <option value="en">EN</option>
        </select>
        <select id="selRegionMovil" style="height:32px;font-size:11px;padding:0 6px;border:1px solid var(--borde);border-radius:6px;background:var(--superficie);color:var(--texto);"></select>
        <button type="button" id="btnTemaMovil" style="width:32px;height:32px;border:1px solid var(--borde);border-radius:6px;background:var(--superficie);color:var(--texto);display:grid;place-items:center;cursor:pointer;"></button>
      </div>
    </header>

    <!-- Banner de Advertencia Offline (M4) -->
    <div class="banner-offline" id="bannerOffline">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3l20 18M8.5 15.5a5 5 0 016.2-.6M5 12a10 10 0 013-1.9M12 19h.01"/></svg>
      <span>Sin conexión: navegando con carné local cifrado.</span>
    </div>

    <!-- Lienzo de Contenido de Pantalla -->
    <main class="movil-lienzo" id="movilLienzo"></main>

    <!-- TabBar de Navegación Inferior Fijo -->
    <nav class="tabbar-movil" aria-label="Navegación inferior">
      <button type="button" class="tab-item-movil activo" data-vista="billetera">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 14.5h2"/></svg>
        <span>Billetera</span>
      </button>
      <button type="button" class="tab-item-movil" data-vista="siniestros">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 011 1v9a1 1 0 01-1 1H4a1 1 0 01-1-1V9a1 1 0 011-1z"/><circle cx="12" cy="13" r="3.5"/></svg>
        <span>Siniestros</span>
      </button>
      <button type="button" class="tab-item-movil" data-vista="cuenta">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>Mi Cuenta</span>
      </button>
    </nav>

  </div>

  <!-- Scripts -->
  <script src="db.js"></script>
  <script src="iconos.js"></script>
  <script src="i18n.js"></script>
  <script src="demo-control.js"></script>
  <script src="app.js"></script>
</body>
</html>
