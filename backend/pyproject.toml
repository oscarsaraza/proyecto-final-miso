[tool.poetry]
name = "solventa-backend"
version = "0.1.0"
description = "Solventa Seguros Digitales - Monolito Modular API-First con FastAPI"
authors = ["Equipo 7 <equipo7@solventa.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
fastapi = ">=0.115.0"
uvicorn = {extras = ["standard"], version = ">=0.32.0"}
pydantic = ">=2.9.0"
pydantic-settings = ">=2.5.0"
sqlalchemy = {extras = ["asyncio"], version = ">=2.0.35"}
asyncpg = ">=0.29.0"
pyjwt = {extras = ["crypto"], version = ">=2.9.0"}
passlib = {extras = ["bcrypt"], version = ">=1.7.4"}
httpx = ">=0.27.2"
python-multipart = ">=0.0.12"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.3"
pytest-asyncio = ">=0.24.0"
pytest-cov = ">=5.0.0"
pytest-mock = ">=3.14.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "--verbose",
    "--cov=app",
    "--cov-report=term-missing",
]
markers = [
    "unit: Pruebas unitarias aisladas de dominio y servicios",
    "integration: Pruebas de integración sobre adaptadores y APIs",
    "contract: Pruebas de contrato OpenAPI",
]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]
