events { worker_connections 1024; }

http {
    # Comprobación pasiva de salud: una réplica que falla se retira del pool durante fail_timeout.
    upstream backend_solventa {
        server api-a:8000 max_fails=2 fail_timeout=3s;
        server api-b:8000 max_fails=2 fail_timeout=3s;
    }

    log_format upstreamlog '$time_iso8601 upstream=$upstream_addr status=$status '
                           'upstream_status=$upstream_status tiempo=$request_time';
    access_log /var/log/nginx/access.log upstreamlog;

    server {
        listen 80;

        location / {
            proxy_pass http://backend_solventa;
            proxy_connect_timeout 300ms;
            proxy_read_timeout 2s;
            # Ante fallo o timeout, la solicitud se reenvía a la réplica sana sin que el cliente lo note.
            # 'non_idempotent' es indispensable: sin él nginx no reintenta un POST ya enviado.
            proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
            proxy_next_upstream_tries 3;
        }
    }
}
